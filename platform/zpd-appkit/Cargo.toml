[package]
name = "zpd-appkit"
edition = "2024"
version.workspace = true
license.workspace = true
[features]
# Exposes Metal-layer canvas views without depending on a GPU crate.
metal = []

[target.'cfg(target_os = "macos")'.dependencies]
zpd-corefoundation = { path = "../zpd-corefoundation" }
zpd-objc = { path = "../zpd-objc" }

[[test]]
name = "native"
path = "tests/native.rs"
harness = false

[[test]]
name = "sidebar"
path = "tests/sidebar.rs"
harness = false

[[test]]
name = "controls"
path = "tests/controls.rs"
harness = false

[[test]]
name = "title_bar"
path = "tests/title_bar.rs"
harness = false

[[test]]
name = "metal_canvas"
path = "tests/metal_canvas.rs"
harness = false
required-features = ["metal"]
