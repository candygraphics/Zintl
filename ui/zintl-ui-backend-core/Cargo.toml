[package]
name = "zintl-ui-backend-core"
edition = "2024"

[dependencies]
zintl-ui = { path = "../zintl-ui" }
zintl-ui-layout = { path = "../zintl-ui-layout" }
zintl-ui-graphics = { path = "../zintl-ui-graphics" }
wgpu = { version = "30", optional = true }
pollster = { version = "1", optional = true }

[features]
# Adds canvases that handlers render with wgpu.
wgpu = ["dep:wgpu", "dep:pollster"]
